<!DOCTYPE html>
<html lang="zh-CN" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>wuli新传考研热点知识库</title>
<meta name="theme-color" content="#f7f5f1" id="themeColorMeta">
<link rel="manifest" href='data:application/manifest+json,{"name":"wuli新传考研热点知识库","short_name":"wuli新传考研","start_url":"./","display":"standalone","background_color":"%23f7f5f1","theme_color":"%23f7f5f1"}'>
<style>
  html[data-theme="default"]{
    --bg:#f7f5f1; --surface:#ffffff; --ink:#191917; --ink-soft:#6e6960;
    --line:#e7e2d9; --brand:#2c5a4c; --brand-soft:#e7efeb; --accent:#c96a35;
    --tag-bg:#f0ede6; --card-border:1px solid var(--line);
    --card-shadow:0 1px 2px rgba(0,0,0,.03), 0 8px 24px -16px rgba(0,0,0,.14);
    --card-hover-shadow:0 12px 30px -20px rgba(0,0,0,.3);
    --hl-bg:#ffe89a; --hl-ink:#5a4500;
    --font:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --radius-lg:20px; --radius-md:16px; --radius-sm:10px;
  }
  html[data-theme="night"]{
    --bg:#0f1115; --surface:#1a1d24; --ink:#e9ecef; --ink-soft:#8b93a0;
    --line:#2a2f3a; --brand:#7fc6a3; --brand-soft:#1d2b26; --accent:#e8a06a;
    --tag-bg:#232830; --card-border:1px solid #2a2f3a;
    --card-shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -20px rgba(0,0,0,.7);
    --card-hover-shadow:0 16px 34px -22px rgba(0,0,0,.9);
    --hl-bg:#5a4a10; --hl-ink:#ffe89a;
    --font:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --radius-lg:18px; --radius-md:14px; --radius-sm:9px;
  }
  html[data-theme="ink"]{
    --bg:#fafaf8; --surface:#ffffff; --ink:#161616; --ink-soft:#7a7a72;
    --line:#dcdcd6; --brand:#2a2a2a; --brand-soft:#f0f0ee; --accent:#a44a2e;
    --tag-bg:#f2f2ef; --card-border:none;
    --card-shadow:none; --card-hover-shadow:none;
    --hl-bg:#f0e0a0; --hl-ink:#2a2000;
    --font:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --radius-lg:0; --radius-md:0; --radius-sm:0;
  }
  html[data-theme="pink"]{
    --bg:#fef5f8; --surface:#ffffff; --ink:#3d2530; --ink-soft:#9c7a89;
    --line:#f7e0e9; --brand:#e879a5; --brand-soft:#fdeaf1; --accent:#c95a7a;
    --tag-bg:#fceef3; --card-border:1px solid #f7e0e9;
    --card-shadow:0 1px 2px rgba(200,120,150,.06), 0 10px 26px -18px rgba(200,120,150,.28);
    --card-hover-shadow:0 14px 32px -20px rgba(200,120,150,.42);
    --hl-bg:#ffd6e5; --hl-ink:#7a1c40;
    --font:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --radius-lg:22px; --radius-md:18px; --radius-sm:11px;
  }
  html[data-theme="retro"]{
    --bg:#f1e8d4; --surface:#faf3e0; --ink:#2b2415; --ink-soft:#75695a;
    --line:#c9b998; --brand:#8b2f0f; --brand-soft:#f0e2d4; --accent:#8b2f0f;
    --tag-bg:#e8dcc3; --card-border:none;
    --card-shadow:none; --card-hover-shadow:none;
    --hl-bg:#f0dca0; --hl-ink:#3a2000;
    --font:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
    --radius-lg:2px; --radius-md:2px; --radius-sm:2px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font);
    font-size:15.5px; line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .35s ease, color .35s ease;
  }
  a{ color:inherit; }

  mark.user-hl{
    background:var(--hl-bg); color:var(--hl-ink);
    padding:1px 2px; border-radius:2px;
    cursor:pointer; transition:background .2s;
  }
  mark.user-hl:hover{ filter:brightness(.95); }

  .hl-bubble{
    position:fixed; z-index:10003;
    display:none; align-items:center; gap:2px;
    padding:4px;
    background:var(--surface);
    border:1px solid var(--brand);
    border-radius:10px;
    box-shadow:0 10px 26px -10px rgba(0,0,0,.35);
    font-family:inherit;
  }
  .hl-bubble.is-open{ display:flex; }
  .hl-bubble button{
    padding:5px 11px; font-size:12.5px; font-family:inherit;
    font-weight:600; color:var(--ink);
    background:none; border:none; border-radius:7px;
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .hl-bubble button:hover{ color:var(--brand); background:var(--brand-soft); }

  .back-to-top{
    position:fixed; right:16px; bottom:24px; z-index:9000;
    width:42px; height:42px;
    display:grid; place-items:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.3);
    color:var(--ink-soft); font-size:18px;
    cursor:pointer; opacity:0; pointer-events:none;
    transform:translateY(8px);
    transition:opacity .3s, transform .3s, color .2s, border-color .2s, background .3s;
    font-family:inherit;
  }
  .back-to-top.is-show{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .back-to-top:hover{ color:var(--brand); border-color:var(--brand); }

  .search-trigger{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; font-size:13px; font-family:inherit;
    color:var(--ink-soft); background:var(--surface);
    border:1px solid var(--line); border-radius:999px;
    cursor:pointer; transition:.2s;
  }
  .search-trigger:hover{ color:var(--brand); border-color:var(--brand); }
  .search-trigger svg{ width:14px; height:14px; }

  .search-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    z-index:9998; display:none; padding:80px 20px 20px;
    animation:fadeIn .2s ease;
  }
  .search-overlay.is-open{ display:block; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .search-panel{
    max-width:680px; margin:0 auto;
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.35);
    overflow:hidden; display:flex; flex-direction:column;
    max-height:calc(100vh - 120px);
  }
  .search-bar{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .search-bar svg{ flex:0 0 16px; width:16px; height:16px; color:var(--ink-soft); }
  .search-input{
    flex:1; min-width:0;
    font-family:inherit; font-size:15px;
    color:var(--ink); background:none; border:none; outline:none;
    padding:4px 0;
  }
  .search-input::placeholder{ color:var(--ink-soft); opacity:.6; }
  .search-close{
    flex:0 0 auto; width:26px; height:26px;
    display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:18px;
    border-radius:50%; transition:.2s;
  }
  .search-close:hover{ color:var(--brand); background:var(--brand-soft); }
  .search-results{ flex:1; overflow-y:auto; padding:8px 0; min-height:120px; }
  .search-hint{ padding:36px 20px; text-align:center; font-size:13.5px; color:var(--ink-soft); line-height:1.8; }
  .search-month{ padding:12px 20px 4px; font-size:11px; font-weight:700; letter-spacing:.18em; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .search-item{
    display:block; width:100%;
    padding:10px 20px; text-align:left; cursor:pointer;
    background:none; border:none; font-family:inherit;
    color:var(--ink); border-left:3px solid transparent;
    transition:.15s;
  }
  .search-item:hover{ background:var(--brand-soft); border-left-color:var(--brand); }
  .search-item-title{ display:block; font-size:14px; font-weight:600; line-height:1.5; margin-bottom:2px; }
  .search-item-sub{
    display:block; font-size:12.5px; color:var(--ink-soft);
    line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .search-item em{ font-style:normal; background:rgba(255,200,80,.35); color:var(--ink); padding:0 2px; border-radius:2px; }
  html[data-theme="night"] .search-item em{ background:rgba(255,200,80,.25); }

  .theme-float{
    position:fixed; right:0; top:60%; z-index:9999;
    display:flex; align-items:center; height:46px;
    background:var(--surface); border:1px solid var(--line);
    border-right:none; border-radius:999px 0 0 999px;
    box-shadow:-6px 6px 22px -12px rgba(0,0,0,.28);
    overflow:hidden;
    transition:background .3s, border-color .3s;
    touch-action:none; cursor:grab;
    user-select:none; -webkit-user-select:none;
  }
  .theme-float:hover{ border-color:var(--brand); }
  .theme-float.dragging{ cursor:grabbing; transition:none; }
  .tf-options{
    display:flex; align-items:center; gap:2px;
    max-width:0; overflow:hidden; padding:0; opacity:0;
    transition:max-width .38s cubic-bezier(.2,.7,.3,1),
               padding .38s cubic-bezier(.2,.7,.3,1),
               opacity .25s;
  }
  .theme-float.is-open .tf-options{ max-width:460px; padding:0 6px 0 10px; opacity:1; }
  .tf-options button{
    flex:0 0 auto; padding:6px 12px;
    font-size:12px; font-family:var(--font); font-weight:600;
    color:var(--ink-soft); background:none; border:none;
    border-radius:999px; cursor:pointer;
    white-space:nowrap; transition:.2s;
  }
  .tf-options button:hover{ color:var(--brand); }
  .tf-options button.is-active{ color:#fff; background:var(--brand); }
  .tf-trigger{
    flex:0 0 46px; width:46px; height:46px;
    display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    font-size:19px; line-height:1; padding:0;
    transition:transform .3s;
  }
  .theme-float.is-open .tf-trigger{ transform:rotate(15deg); }

  .topbar{
    max-width:1080px; margin:0 auto; padding:20px 24px 0;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{
    display:inline-flex; align-items:center; gap:9px;
    font-size:14px; font-weight:600;
    background:none; border:none; cursor:pointer;
    color:var(--ink); font-family:inherit; padding:0;
    letter-spacing:.02em;
  }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--brand); transition:background .3s; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .back{
    display:none;
    padding:7px 15px; font-size:13px;
    color:var(--ink-soft); background:var(--surface);
    border:1px solid var(--line); border-radius:999px;
    cursor:pointer; font-family:inherit;
    transition:.2s;
  }
  .back:hover{ color:var(--brand); border-color:var(--brand); }
  .back.is-show{ display:inline-block; }

  .view{ display:none; }
  .view.is-active{
    display:block;
    animation:fadeUp .42s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:none; }
  }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px 90px; }
  .wrap-narrow{ max-width:960px; margin:0 auto; padding:0 24px 90px; }

  .hero{ padding:6vh 0 0; max-width:760px; }
  .eyebrow{
    margin:0 0 18px;
    font-size:12.5px; font-weight:600;
    letter-spacing:.18em; color:var(--ink-soft);
  }
  .hero h1{
    margin:0 0 22px;
    font-size:clamp(2.1rem, 5.6vw, 3.4rem);
    font-weight:700; line-height:1.22; letter-spacing:-.01em;
  }
  .hero h1 .wuli{ color:var(--brand); }
  .lede{
    margin:0; max-width:46ch;
    font-size:15.5px; color:var(--ink-soft); line-height:1.9;
  }
  .checkin{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:18px; padding:5px 12px;
    font-size:12.5px; color:var(--brand);
    background:var(--brand-soft); border-radius:999px;
    font-weight:500; transition:.3s;
  }
  .checkin.hidden{ display:none; }
  .checkin b{ font-weight:700; font-variant-numeric:tabular-nums; }

  .entries{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:16px; margin-top:44px;
  }
  .entry{
    position:relative;
    display:flex; flex-direction:column;
    min-height:200px; padding:22px;
    background:var(--surface);
    border:var(--card-border);
    border-radius:var(--radius-lg);
    text-align:left; cursor:pointer;
    font-family:inherit; color:var(--ink);
    box-shadow:var(--card-shadow);
    transition:transform .32s cubic-bezier(.2,.7,.3,1),
               box-shadow .32s, border-color .32s, background .3s;
  }
  .entry:hover{
    transform:translateY(-4px);
    border-color:var(--brand);
    box-shadow:var(--card-hover-shadow);
  }
  .entry-icon{
    width:42px; height:42px;
    display:grid; place-items:center;
    border-radius:calc(var(--radius-md) - 2px);
    background:var(--brand-soft); color:var(--brand);
    transition:background .3s, color .3s;
  }
  .entry:hover .entry-icon{ background:var(--brand); color:#fff; }
  html[data-theme="ink"] .entry:hover .entry-icon{ color:#fff; }
  html[data-theme="retro"] .entry:hover .entry-icon{ color:#fff; }
  .entry-title{
    margin:16px 0 6px;
    font-size:17px; font-weight:700;
    letter-spacing:-.01em;
  }
  .entry-desc{
    margin:0; font-size:13px; color:var(--ink-soft);
    line-height:1.7;
  }
  .entry-foot{ margin-top:auto; padding-top:14px; }
  .entry-meta{
    font-size:11.5px; letter-spacing:.02em;
    color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .entry-arrow{
    position:absolute; right:20px; bottom:20px;
    font-size:17px; color:var(--ink-soft);
    transition:transform .3s, color .3s;
  }
  .entry:hover .entry-arrow{ transform:translateX(6px); color:var(--brand); }

  .foot{
    margin-top:64px; padding-top:22px;
    border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-soft);
  }

  .feedback{ margin-top:14px; }
  .feedback-toggle{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; width:100%; padding:8px 0;
    background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:13px; color:var(--ink-soft);
    text-align:left; transition:color .2s;
  }
  .feedback-toggle:hover{ color:var(--brand); }
  .feedback-toggle .ft-text{
    line-height:1.6; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; flex:1; min-width:0;
  }
  .feedback-toggle .ft-text .sep{ margin:0 6px; opacity:.45; }
  .feedback-toggle .ft-arrow{
    flex:0 0 auto; font-size:14px; color:var(--ink-soft);
    transition:transform .3s, color .3s;
  }
  .feedback-toggle.is-open .ft-arrow{ transform:rotate(45deg); color:var(--brand); }
  .feedback-toggle.is-open{ color:var(--brand); }
  .feedback-panel{
    display:none; padding:14px 0 4px;
    animation:fadeUp .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .feedback-panel.is-open{ display:block; }
  .feedback-input{
    display:block; width:100%; min-height:80px;
    padding:11px 14px; font-family:inherit; font-size:14px;
    line-height:1.7; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-sm);
    resize:vertical; outline:none; transition:border-color .2s;
  }
  .feedback-input:focus{ border-color:var(--brand); }
  .feedback-input::placeholder{ color:var(--ink-soft); opacity:.65; }
  .feedback-actions{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-top:10px; flex-wrap:wrap;
  }
  .feedback-send{
    padding:7px 18px; font-size:13px; font-weight:600;
    font-family:inherit; color:#fff; background:var(--brand);
    border:none; border-radius:999px; cursor:pointer;
    transition:opacity .2s, transform .2s;
  }
  .feedback-send:hover{ opacity:.88; }
  .feedback-hint{
    font-size:12px; color:var(--ink-soft);
    transition:color .2s; flex:1; min-width:0;
  }
  .feedback-hint.success{ color:var(--brand); font-weight:600; }

  .page-head{ padding:5vh 0 0; }
  .head-row{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:18px 24px; flex-wrap:wrap;
  }
  .page-head h1{
    margin:0;
    font-size:clamp(1.8rem, 3.8vw, 2.4rem);
    font-weight:700; letter-spacing:-.01em; line-height:1.2;
  }
  .head-meta{
    font-size:13px; color:var(--ink-soft);
    letter-spacing:.02em; white-space:nowrap; padding-bottom:4px;
  }
  .head-meta b{
    color:var(--brand); font-weight:700;
    font-variant-numeric:tabular-nums;
    margin:0 2px; font-size:14.5px;
  }
  .head-meta .sep{ margin:0 8px; opacity:.45; }

  .month-tabs{ margin:32px 0 0; border-bottom:1px solid var(--line); }
  .tab-track{ display:flex; gap:0; overflow-x:auto; scrollbar-width:none; }
  .tab-track::-webkit-scrollbar{ display:none; }
  .tab{
    position:relative; flex:0 0 auto;
    padding:0 0 16px; margin-right:40px;
    background:none; border:none; cursor:pointer;
    font-family:inherit;
  }
  .tab .en{
    display:block;
    font-size:17px; font-weight:700; letter-spacing:.18em;
    color:var(--ink-soft); transition:color .25s;
  }
  .tab::after{
    content:""; position:absolute;
    left:0; right:0; bottom:-1px; height:2px;
    background:var(--brand);
    transform:scaleX(0); transform-origin:left;
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .tab:hover .en{ color:var(--ink); }
  .tab.is-active .en{ color:var(--brand); }
  .tab.is-active::after{ transform:scaleX(1); }

  .month-panel{ display:none; margin-top:28px; }
  .month-panel.is-active{
    display:block;
    animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both;
  }
  .panel-intro{ margin:0 0 24px; }
  .intro-line1{
    margin:0 0 5px; font-size:15px; font-weight:600;
    color:var(--ink); letter-spacing:-.005em;
  }
  .intro-line1 .count{
    margin:0 3px; font-size:19px; font-weight:700;
    color:var(--brand); font-variant-numeric:tabular-nums;
  }
  .intro-line2{
    margin:0; font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .intro-line2 .badge{
    display:inline-block; padding:2px 9px;
    font-size:11px; font-weight:500;
    color:var(--ink-soft); background:var(--tag-bg);
    border-radius:999px; letter-spacing:.02em;
  }
  .intro-line2 .mine-badge{
    display:inline-block; padding:2px 9px;
    font-size:11px; font-weight:600;
    color:#fff; background:var(--accent);
    border-radius:999px; letter-spacing:.02em;
  }

  .event-list{ display:grid; gap:14px; }
  .event-card{
    position:relative;
    background:var(--surface);
    border:var(--card-border);
    border-radius:var(--radius-md);
    overflow:hidden;
    box-shadow:var(--card-shadow);
    transition:border-color .28s, box-shadow .28s, background .3s;
  }
  .event-card:hover{
    border-color:var(--brand);
    box-shadow:var(--card-hover-shadow);
  }
  .event-card.is-target{ animation:flashCard 1.8s ease; }
  @keyframes flashCard{
    0%,100%{ box-shadow:var(--card-shadow); }
    20%,60%{ box-shadow:0 0 0 3px var(--brand); }
  }
  .event-card.is-my-note{ border-color:var(--accent); }
  html[data-theme="ink"] .event-card{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    margin-top:-1px;
  }
  html[data-theme="ink"] .event-card:hover{ border-color:var(--brand); box-shadow:none; }
  html[data-theme="ink"] .event-list{ gap:0; }
  html[data-theme="retro"] .event-card{
    border-top:1px solid #c9b998;
    border-bottom:1px solid #c9b998;
    border-left:none; border-right:none;
    margin-top:-1px;
  }
  html[data-theme="retro"] .event-card:hover{ border-color:#8b2f0f; box-shadow:none; }
  html[data-theme="retro"] .event-list{ gap:0; }

  .event-header{
    display:flex; align-items:flex-start; gap:16px;
    padding:20px 60px 20px 24px;
    cursor:pointer; user-select:none;
  }
  .event-idx{
    flex:0 0 32px; width:32px; height:32px;
    display:grid; place-items:center;
    border-radius:var(--radius-sm); font-size:13px; font-weight:700;
    background:var(--brand-soft); color:var(--brand);
    transition:background .25s, color .25s;

  }
  .event-card.is-open .event-idx{ background:var(--brand); color:#fff; }
  html[data-theme="ink"] .event-idx{

  }

  html[data-theme="retro"] .event-idx{ background:#2b2415; color:#faf3e0; border-radius:1px; }
  html[data-theme="retro"] .event-card.is-open .event-idx{ background:var(--brand); color:#fff; }

  .event-body{ flex:1; min-width:0; }
  .event-month{
    display:inline-block; margin-bottom:6px;
    padding:1px 8px; font-size:10.5px; font-weight:700;
    letter-spacing:.14em; color:var(--brand);

  }
  html[data-theme="retro"] .event-month{ border:1px solid var(--brand); background:transparent; }
  html[data-theme="retro"] .event-card.is-open .event-month{ background:var(--brand); color:#faf3e0; }
  html[data-theme="retro"] .event-month.mine-month{ border-color:var(--accent); background:var(--accent); color:#fff; }

  .event-title{
    margin:0 0 6px; font-size:16.5px; font-weight:700;
    letter-spacing:-.005em; line-height:1.5;
  }
  .event-sub{
    margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.7;
  }
  .event-toggle{
    position:absolute; right:24px; top:24px;
    width:24px; height:24px;
    display:grid; place-items:center;
    color:var(--ink-soft); font-size:16px;
    transition:transform .3s;
  }
  .event-card.is-open .event-toggle{ transform:rotate(45deg); color:var(--brand); }

  .event-actions{
    position:absolute;
    top:22px; right:52px;
    display:flex; gap:4px;
    opacity:.55;
    transition:opacity .25s;
  }
  .event-card:hover .event-actions,
  .event-card.is-open .event-actions{ opacity:1; }
  .event-actions button{
    width:24px; height:24px;
    display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); border-radius:50%;
    transition:color .2s, background .2s;
    padding:0;
  }
  .event-actions button:hover{ color:var(--brand); background:var(--brand-soft); }
  .event-actions button svg{ width:13px; height:13px; }
  .event-actions .bookmark-btn.is-marked{ color:var(--accent); opacity:1; }
  .event-actions .bookmark-btn.is-marked svg{ fill:currentColor; }
  .note-actions button.del-btn:hover{ color:var(--accent); }

  .event-detail{
    display:none; padding:0 24px 22px 72px; font-size:14.5px;
  }
  .event-card.is-open .event-detail{ display:block; }
  #topicEvents .event-detail,
  #bookmarkContent .event-detail,
  #noteContent .event-detail{ padding-left:24px; }
  .event-card.is-my-note .event-detail{ padding-left:24px; }

  .detail-block{ margin-bottom:14px; }
  .detail-block:last-child{ margin-bottom:0; }
  .detail-label{
    display:inline-block; margin-bottom:6px;
    font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:var(--accent);
  }
  html[data-theme="ink"] .detail-label::before{ content:"— "; }
  html[data-theme="retro"] .detail-label::before{ content:"§ "; }
  .detail-text{ margin:0; color:var(--ink); line-height:1.85; }

  .theory-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .theory-tag{
    padding:3px 11px; font-size:12px; font-weight:500;
    background:var(--tag-bg); color:var(--ink-soft);
    border-radius:999px; cursor:pointer;
    border:none; font-family:inherit;
    transition:.2s;
  }
  .theory-tag:hover{ background:var(--brand); color:#fff; }
  html[data-theme="ink"] .theory-tag{
    border-radius:0; background:transparent; border:1px solid var(--line);
  }
  html[data-theme="ink"] .theory-tag:hover{ border-color:var(--brand); background:transparent; color:var(--brand); }
  html[data-theme="retro"] .theory-tag{ border-radius:1px; }

  .exam-hint{
    margin-top:14px; padding:14px 18px;
    background:var(--brand-soft); border-radius:var(--radius-sm);
    font-size:14px; line-height:1.8;
  }
  html[data-theme="ink"] .exam-hint{
    border-left:3px solid var(--brand); border-radius:0;
    padding:10px 0 10px 16px; background:transparent;
  }
  html[data-theme="retro"] .exam-hint{
    border-left:3px solid var(--brand); border-radius:0;
    padding:10px 0 10px 16px; background:transparent;
  }
  .exam-hint::before{
    content:"✦ 答题金句"; display:block; margin-bottom:5px;
    font-size:11.5px; font-weight:700;
    letter-spacing:.08em; color:var(--brand);
  }
  html[data-theme="ink"] .exam-hint::before{ content:"答题金句"; letter-spacing:.14em; }
  html[data-theme="retro"] .exam-hint::before{ content:"答题金句"; letter-spacing:.14em; }

  .theory-popup{
    position:fixed; z-index:9997;
    max-width:280px; padding:12px 16px;
    background:var(--surface);
    border:1px solid var(--brand);
    border-radius:12px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.4);
    font-size:13px; line-height:1.75;
    color:var(--ink); display:none;
    animation:fadeIn .2s ease;
  }
  .theory-popup.is-open{ display:block; }
  .theory-popup .tp-name{
    display:block; margin-bottom:6px;
    font-size:12.5px; font-weight:700;
    color:var(--brand); letter-spacing:.02em;
  }
  .theory-popup .tp-empty{ color:var(--ink-soft); font-style:italic; }

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:16px; margin-top:32px;
  }
  .cat-card{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; padding:22px;
    background:var(--surface); border:var(--card-border);
    border-radius:var(--radius-md);
    text-align:left; cursor:pointer;
    font-family:inherit; color:var(--ink);
    box-shadow:var(--card-shadow);
    transition:transform .28s cubic-bezier(.2,.7,.3,1),
               border-color .28s, box-shadow .28s, background .3s;
  }
  .cat-card:hover{
    transform:translateY(-3px);
    border-color:var(--brand);
    box-shadow:var(--card-hover-shadow);
  }
  .cat-card h3{ margin:0; font-size:15px; font-weight:600; }
  .cc-count{
    flex:0 0 auto; font-size:12.5px;
    color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  html[data-theme="ink"] .cat-card{
    border:none; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    border-radius:0; box-shadow:none;
  }
  html[data-theme="retro"] .cat-card{
    border:none; border-top:1px solid #c9b998; border-bottom:1px solid #c9b998;
    border-radius:0; box-shadow:none;
  }

  .topic-head{ padding:4vh 0 0; }
  .topic-back{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px; font-size:12.5px;
    color:var(--ink-soft); background:var(--surface);
    border:1px solid var(--line); border-radius:999px;
    cursor:pointer; font-family:inherit;
    margin-bottom:22px; transition:.22s;
  }
  .topic-back:hover{ color:var(--brand); border-color:var(--brand); }
  .topic-title-row{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:18px 24px; flex-wrap:wrap;
  }
  .topic-head h1{
    margin:0;
    font-size:clamp(1.8rem, 3.8vw, 2.4rem);
    font-weight:700; letter-spacing:-.01em; line-height:1.2;
  }
  .topic-desc{
    margin:14px 0 0; max-width:58ch;
    font-size:14.5px; color:var(--ink-soft); line-height:1.85;
  }
  .topic-divider{ margin:26px 0 0; border-top:1px solid var(--line); }
  .placeholder-note{
    margin-top:26px; padding:14px 18px;
    font-size:13px; color:var(--ink-soft);
    background:var(--brand-soft); border-radius:var(--radius-sm);
    line-height:1.8;
  }
  html[data-theme="ink"] .placeholder-note{
    border-left:3px solid var(--brand); border-radius:0;
    background:transparent; padding-left:16px;
  }
  html[data-theme="retro"] .placeholder-note{
    border-left:3px solid var(--brand); border-radius:0;
    background:transparent; padding-left:16px;
  }

  .empty-state{
    margin-top:32px;
    padding:56px 24px;
    text-align:center;
    background:var(--surface);
    border:var(--card-border);
    border-radius:var(--radius-md);
    box-shadow:var(--card-shadow);
  }
  .empty-state .es-icon{ font-size:34px; margin-bottom:14px; opacity:.4; }
  .empty-state .es-title{
    margin:0 0 8px; font-size:16px; font-weight:600; color:var(--ink);
  }
  .empty-state .es-desc{
    margin:0 auto; max-width:38ch;
    font-size:13.5px; color:var(--ink-soft); line-height:1.85;
  }
  .empty-state .es-action{
    margin-top:20px; padding:8px 22px;
    font-size:13px; font-weight:600;
    font-family:inherit; color:#fff;
    background:var(--brand); border:none;
    border-radius:999px; cursor:pointer;
    transition:opacity .2s;
  }
  .empty-state .es-action:hover{ opacity:.88; }

  .pill-tabs{
    display:flex; gap:4px;
    margin:28px 0 0; padding:4px;
    background:var(--tag-bg);
    border-radius:999px;
    width:fit-content;
  }
  .pill-tabs button{
    padding:6px 16px; font-size:13px;
    font-family:inherit; font-weight:600;
    color:var(--ink-soft); background:none;
    border:none; border-radius:999px;
    cursor:pointer; transition:.2s;
  }
  .pill-tabs button:hover{ color:var(--brand); }
  .pill-tabs button.is-active{ color:#fff; background:var(--brand); }
  .pill-tabs button .pt-count{
    margin-left:5px; font-weight:400;
    opacity:.7; font-variant-numeric:tabular-nums;
  }

  .hl-list{ margin-top:22px; display:grid; gap:12px; }
  .hl-item{
    position:relative;
    padding:16px 46px 16px 20px;
    background:var(--surface);
    border:var(--card-border);
    border-radius:var(--radius-md);
    box-shadow:var(--card-shadow);
  }
  .hl-item-text{
    margin:0 0 8px;
    font-size:14.5px; line-height:1.8;
    background:var(--hl-bg); color:var(--hl-ink);
    padding:2px 4px; border-radius:2px;
    display:inline;
  }
  .hl-item-meta{
    display:block; font-size:12px;
    color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .hl-item-meta button{
    background:none; border:none; padding:0;
    color:var(--brand); cursor:pointer;
    font-family:inherit; font-size:12px;
    font-weight:600; margin-left:6px;
  }
  .hl-item-meta button:hover{ text-decoration:underline; }
  .hl-item-remove{
    position:absolute; top:14px; right:14px;
    width:24px; height:24px;
    display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); border-radius:50%;
    transition:.2s; font-size:14px;
  }
  .hl-item-remove:hover{ color:var(--accent); background:var(--brand-soft); }

  .notes-toolbar{
    display:flex; flex-wrap:wrap;
    align-items:center; gap:8px;
    margin-top:24px;
  }
  .new-note-btn, .tool-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 18px;
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    color:#fff;
    background:var(--brand);
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:opacity .2s, transform .2s;
  }
  .new-note-btn:hover, .tool-btn:hover{ opacity:.88; }
  .new-note-btn:active, .tool-btn:active{ transform:scale(.98); }
  .tool-btn.secondary{
    color:var(--ink-soft);
    background:var(--tag-bg);
  }
  .tool-btn.secondary:hover{ color:var(--brand); }

  .data-notice{
    margin-top:22px;
    padding:14px 18px;
    font-size:12.5px;
    line-height:1.8;
    color:var(--ink-soft);
    background:var(--brand-soft);
    border-radius:var(--radius-sm);
    border-left:3px solid var(--brand);
  }
  .data-notice b{ color:var(--ink); font-weight:600; }

  .note-editor{
    position:fixed; inset:0;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    z-index:10005;
    display:none; padding:60px 20px 20px;
    animation:fadeIn .2s ease;
  }
  .note-editor.is-open{ display:block; }
  .ne-panel{
    max-width:640px;
    margin:0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
    max-height:calc(100vh - 100px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .ne-head{
    padding:18px 22px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .ne-head h2{
    margin:0;
    font-size:16px;
    font-weight:700;
    letter-spacing:-.005em;
  }
  .ne-close{
    width:28px; height:28px;
    display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); font-size:20px;
    border-radius:50%;
    transition:.2s;
  }
  .ne-close:hover{ color:var(--accent); background:var(--brand-soft); }
  .ne-body{
    flex:1;
    overflow-y:auto;
    padding:20px 22px;
  }
  .ne-field{ margin-bottom:14px; }
  .ne-field:last-child{ margin-bottom:0; }
  .ne-label{
    display:block;
    margin-bottom:6px;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .ne-label .ne-req{ color:var(--accent); margin-left:2px; }
  .ne-input, .ne-textarea, .ne-select{
    display:block;
    width:100%;
    padding:9px 12px;
    font-family:inherit;
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .ne-select{ cursor:pointer; }
  .ne-input:focus, .ne-textarea:focus, .ne-select:focus{
    border-color:var(--brand);
    background:var(--surface);
  }
  .ne-input::placeholder, .ne-textarea::placeholder{
    color:var(--ink-soft);
    opacity:.55;
  }
  .ne-textarea{
    min-height:80px;
    resize:vertical;
  }
  .ne-foot{
    padding:14px 22px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  .ne-btn{
    padding:8px 20px;
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .ne-btn-cancel{
    background:var(--tag-bg);
    color:var(--ink-soft);
  }
  .ne-btn-cancel:hover{ color:var(--ink); }
  .ne-btn-save{
    background:var(--brand);
    color:#fff;
  }
  .ne-btn-save:hover{ opacity:.88; }

  .toast{
    position:fixed; left:50%; bottom:36px;
    transform:translateX(-50%) translateY(20px);
    z-index:10001; padding:10px 20px;
    font-size:13px; color:#fff;
    background:var(--brand);
    border-radius:999px;
    box-shadow:0 12px 28px -12px rgba(0,0,0,.4);
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    font-family:inherit;
  }
  .toast.is-show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:720px){
    .theme-float{ height:42px; }
    .tf-trigger{ flex:0 0 42px; width:42px; height:42px; font-size:17px; }
    .theme-float.is-open .tf-options{ max-width:300px; padding:0 4px 0 8px; }
    .tf-options button{ padding:5px 10px; font-size:11.5px; }
    .entries{ grid-template-columns:repeat(2, 1fr); gap:12px; margin-top:36px; }
    .entry{ min-height:0; padding:18px; }
    .entry-title{ margin-top:12px; font-size:15px; }
    .entry-desc{ display:none; }
    .entry-foot{ padding-top:8px; }
    .hero{ padding-top:4vh; }
    .topbar{ padding:18px 18px 0; }
    .wrap, .wrap-narrow{ padding:0 18px 70px; }
    .page-head{ padding-top:3.5vh; }
    .month-tabs{ margin-top:28px; }
    .event-header{ padding:16px 56px 16px 18px; gap:12px; }
    .event-detail{ padding:0 18px 20px 18px; }
    #topicEvents .event-detail,
    #bookmarkContent .event-detail,
    #noteContent .event-detail{ padding-left:18px; }
    .event-actions{ right:44px; top:18px; }
    .event-toggle{ right:18px; top:18px; }
    .tab{ margin-right:24px; }
    .tab .en{ font-size:15px; letter-spacing:.14em; }
    .intro-line1{ font-size:14px; }
    .intro-line1 .count{ font-size:17px; }
    .topic-head{ padding-top:3vh; }
    .feedback-toggle{ font-size:12px; gap:8px; }
    .search-overlay{ padding:60px 12px 12px; }
    .search-panel{ max-height:calc(100vh - 80px); }
    .back-to-top{ right:12px; bottom:16px; width:38px; height:38px; font-size:16px; }
    .empty-state{ padding:44px 20px; }
    .note-editor{ padding:40px 12px 12px; }
    .ne-panel{ max-height:calc(100vh - 60px); }
    .notes-toolbar{ flex-direction:column; align-items:stretch; }
    .new-note-btn, .tool-btn{ justify-content:center; }
  }
  @media (max-width:480px){
    .head-row{ gap:4px; }
    .head-meta{ font-size:12px; padding-bottom:2px; }
    .head-meta b{ font-size:13px; }
    .search-trigger span{ display:none; }
    .search-trigger{ padding:7px 10px; }
    .entries{ grid-template-columns:1fr; }
    .entry-desc{ display:block; }
  }
</style>
</head>
<body>

<div class="theme-float" id="themeFloat" role="group" aria-label="主题切换">
  <div class="tf-options">
    <button data-set-theme="auto">自动</button>
    <button data-set-theme="default" class="is-active">暖</button>
    <button data-set-theme="night">夜</button>
    <button data-set-theme="ink">墨</button>
    <button data-set-theme="pink">粉</button>
    <button data-set-theme="retro">报</button>
  </div>
  <button class="tf-trigger" aria-label="切换主题">🎨</button>
</div>

<button class="back-to-top" id="backToTop" aria-label="回到顶部">↑</button>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input class="search-input" id="searchInput" type="search" placeholder="搜索热点标题、理论、关键词…" autocomplete="off">
      <button class="search-close" id="searchClose" aria-label="关闭">×</button>
    </div>
    <div class="search-results" id="searchResults">
      <p class="search-hint">输入关键词，比如「AI」「国际传播」「算法」「情绪」</p>
    </div>
  </div>
</div>

<div class="theory-popup" id="theoryPopup"></div>
<div class="hl-bubble" id="hlBubble">
  <button data-hl-action="toggle">高亮收藏</button>
</div>
<div class="toast" id="toast"></div>

<div class="note-editor" id="noteEditor">
  <div class="ne-panel">
    <div class="ne-head">
      <h2 id="noteEditorTitle">新建卡片</h2>
      <button class="ne-close" id="noteEditorClose" aria-label="关闭">×</button>
    </div>
    <div class="ne-body">
      <div class="ne-field">
        <label class="ne-label">归档月份 <span class="ne-req">*</span></label>
        <select class="ne-select" id="neMonth">
          <option value="01">JAN · 1月</option>
          <option value="02">FEB · 2月</option>
          <option value="03">MAR · 3月</option>
          <option value="04">APR · 4月</option>
          <option value="05">MAY · 5月</option>
          <option value="06">JUN · 6月</option>
          <option value="07">JUL · 7月</option>
          <option value="08">AUG · 8月</option>
          <option value="09">SEP · 9月</option>
          <option value="10">OCT · 10月</option>
          <option value="11">NOV · 11月</option>
          <option value="12">DEC · 12月</option>
        </select>
      </div>
      <div class="ne-field">
        <label class="ne-label">标题 <span class="ne-req">*</span></label>
        <input class="ne-input" id="neTitle" type="text" placeholder="给这条笔记起个名字">
      </div>

/* ============ 工具 ============ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function highlight(text, q){
  if(!q) return esc(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx < 0) return esc(text);
  return esc(text.slice(0, idx))
    + "<em>" + esc(text.slice(idx, idx + q.length)) + "</em>"
    + esc(text.slice(idx + q.length));
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("is-show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("is-show"), 1800);
}
function eventKey(m, i){ return m + "-" + i; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function getBookmarks(){
  try{ return JSON.parse(localStorage.getItem("wuli-bookmarks") || "[]"); }
  catch(e){ return []; }
}
function setBookmarks(arr){

}
function isBookmarked(m, i){ return getBookmarks().indexOf(eventKey(m, i)) >= 0; }

function getHighlights(){

  catch(e){ return {}; }
}

function getNotesByMonth(m){

}

/* ============ 渲染卡片 ============ */
function renderEventCard(ev, monthKey, idx, showIdx){
  const key = eventKey(monthKey, idx);
  const marked = isBookmarked(monthKey, idx);
  const monthLabel = HOTSPOTS[monthKey] ? HOTSPOTS[monthKey].en : monthKey;

  let extraHTML = "";
  if(ev.framework) extraHTML += `<div class="detail-block" style="margin-top:14px;"><span class="detail-label">答题框架</span><div class="framework-block">${esc(ev.framework)}</div></div>`;
  if(ev.mockQuestion) extraHTML += `<div class="mock-block">${esc(ev.mockQuestion)}</div>`;
  if(ev.relatedExams && ev.relatedExams.length){
    extraHTML += `<div class="exams-block">`;
    ev.relatedExams.forEach(ex => {
      extraHTML += `<div class="exam-item"><span class="exam-meta">${esc(ex.year || "")} · ${esc(ex.type || "")}</span>${esc(ex.question || "")}</div>`;
    });
    extraHTML += `</div>`;
  }

  const idxHTML = showIdx ? `<span class="event-idx">${String(idx+1).padStart(2,"0")}</span>` : "";

  return `
    <article class="event-card" data-month="${monthKey}" data-idx="${idx}">
      <div class="event-actions">
        <button class="bookmark-btn${marked ? " is-marked" : ""}" data-bookmark="${key}" aria-label="收藏" title="收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </div>
      <header class="event-header" role="button" tabindex="0" aria-expanded="false">
        ${idxHTML}
        <div class="event-body">
          ${!showIdx ? `<span class="event-month">${monthLabel}</span>` : ""}
          <h3 class="event-title">${esc(ev.title)}</h3>
          <p class="event-sub">${esc(ev.sub)}</p>
        </div>
      </header>
      <span class="event-toggle" aria-hidden="true">＋</span>
      <div class="event-detail">
        <div class="detail-block">
          <span class="detail-label">事件分析</span>
          <p class="detail-text">${esc(ev.analysis)}</p>
          <div class="theory-tags">
            ${(ev.theory||"").split(" · ").map(t=>`<button class="theory-tag" data-theory="${esc(t)}">${esc(t)}</button>`).join("")}

        </div>
        ${extraHTML}

    </article>
  `;
}

function renderMonthly(){
  const trackEl  = document.getElementById("tabTrack");
  const panelsEl = document.getElementById("monthPanels");
  const metaEl   = document.getElementById("headMeta");

  const totalMonths = MONTH_ORDER.length;
  const totalEvents = MONTH_ORDER.reduce((s,k) => s + HOTSPOTS[k].events.length, 0);
  const totalNotes = getNotes().filter(n => MONTH_ORDER.includes(n.month)).length;
  metaEl.innerHTML = `已收录 <b>${totalMonths}</b> 个月<span class="sep">·</span>共 <b>${totalEvents + totalNotes}</b> 条热点`;

  trackEl.innerHTML = MONTH_ORDER.map((key, i) =>
    `<button class="tab${i===0?" is-active":""}" data-month="${key}">
      <span class="en">${HOTSPOTS[key].en}</span>
    </button>`).join("");

  panelsEl.innerHTML = MONTH_ORDER.map((key, i) => {
    const m = HOTSPOTS[key];
    const n = m.events.length;
    const notesOfMonth = getNotesByMonth(key).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    const notesHTML = notesOfMonth.map(nt => renderNoteCard(nt, false)).join("");
    const eventsHTML = m.events.map((ev, j) => renderEventCard(ev, key, j, true)).join("");
    const totalCount = n + notesOfMonth.length;
    const noteBadge = notesOfMonth.length
      ? `<span class="mine-badge">含我的 ${notesOfMonth.length} 条</span>`
      : "";
    return `<section class="month-panel${i===0?" is-active":""}" id="panel-${key}">
      <div class="panel-intro">
        <p class="intro-line1">本月收录<span class="count">${totalCount}</span>条热点 ${noteBadge}</p>
        <p class="intro-line2">选中任意文字可高亮收藏<span class="badge">仅供参考版</span></p>
      </div>
      <div class="event-list">${notesHTML}${eventsHTML}</div>
    </section>`;
  }).join("");

  trackEl.addEventListener("click", e => {
    const btn = e.target.closest(".tab");
    if(!btn) return;
    switchMonth(btn.dataset.month);
  });
}

function switchMonth(key){
  const trackEl  = document.getElementById("tabTrack");
  const panelsEl = document.getElementById("monthPanels");
  trackEl.querySelectorAll(".tab").forEach(b => b.classList.toggle("is-active", b.dataset.month === key));
  panelsEl.querySelectorAll(".month-panel").forEach(p => p.classList.toggle("is-active", p.id === "panel-"+key));
  applySavedHighlights();
}

let bmCurrentTab = "cards";

function renderBookmarks(){
  const wrap = document.getElementById("bookmarkContent");
  const metaEl = document.getElementById("bookmarkMeta");
  const countEl = document.getElementById("bookmarkCount");

  const cardList = getBookmarks();
  const hlObj = getHighlights();
  const sentCount = Object.values(hlObj).reduce((s, arr) => s + arr.length, 0);

  if(countEl) countEl.textContent = `${cardList.length + sentCount} 条收藏`;
  if(metaEl) metaEl.innerHTML = `共 <b>${cardList.length + sentCount}</b> 条`;

  const bmCardCountEl = document.getElementById("bmCardCount");
  const bmSentCountEl = document.getElementById("bmSentCount");
  if(bmCardCountEl) bmCardCountEl.textContent = `(${cardList.length})`;
  if(bmSentCountEl) bmSentCountEl.textContent = `(${sentCount})`;

  if(bmCurrentTab === "cards"){
    if(cardList.length === 0){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">🔖</div>
          <p class="es-title">还没有收藏卡片</p>
          <p class="es-desc">在「每月热点」「专题热点」里点击卡片右上角的小书签，就可以收藏整张卡片。</p>
          <button class="es-action" data-goto="monthly">去每月热点看看 →</button>
        </div>`;
      return;
    }

    const grouped = {};
    cardList.forEach(key => {
      const [m, i] = key.split("-");
      if(!HOTSPOTS[m]) return;
      if(!grouped[m]) grouped[m] = [];
      grouped[m].push(parseInt(i, 10));
    });

    const sortedMonths = Object.keys(grouped).sort();
    let html = "";
    sortedMonths.forEach(m => {
      grouped[m].sort((a, b) => a - b);
      const cards = grouped[m].map(i => {
        const ev = HOTSPOTS[m].events[i];
        if(!ev) return "";
        return renderEventCard(ev, m, i, false);
      }).join("");
      html += `<div class="event-list" style="margin-bottom:22px;">${cards}</div>`;
    });
    wrap.innerHTML = html;
  } else {
    const items = [];
    Object.keys(hlObj).forEach(key => {
      const [m, i] = key.split("-");
      hlObj[key].forEach(text => {
        items.push({ month: m, idx: i, text, key });
      });
    });

    if(items.length === 0){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">✏️</div>
          <p class="es-title">还没有高亮句子</p>
          <p class="es-desc">在任意卡片里选中一段文字，浮出气泡后点击「高亮收藏」，句子就会出现在这里。</p>
          <button class="es-action" data-goto="monthly">去试试划句 →</button>
        </div>`;
      return;
    }

    items.sort((a, b) => b.month.localeCompare(a.month));

    let html = `<div class="hl-list">`;
    items.forEach(item => {
      const mInfo = HOTSPOTS[item.month];
      const ev = mInfo && mInfo.events[parseInt(item.idx, 10)];
      let monthLabel = mInfo ? mInfo.en : (MONTH_LABELS[item.month] || item.month);
      let title = ev ? ev.title : "";

      if(!ev && item.key.indexOf("note-") === 0){
        const noteId = item.key.replace("note-", "");
        const note = getNotes().find(n => n.id === noteId);
        if(note){
          monthLabel = MONTH_LABELS[note.month] || note.month;
          title = note.title;
        } else {
          title = "（已删除的卡片）";
        }
      } else if(!ev){
        title = "（已删除的卡片）";
      }

      html += `
        <div class="hl-item">
          <button class="hl-item-remove" data-hl-remove="${esc(item.key)}|${esc(item.text)}" aria-label="移除">×</button>
          <p class="hl-item-text">${esc(item.text)}</p>
          <span class="hl-item-meta">
            ${monthLabel} · ${esc(title)}
          </span>
        </div>`;
    });
    html += `</div>`;
    wrap.innerHTML = html;
  }
  setTimeout(applySavedHighlights, 50);
}

      </div>`;
    return;
  }

  const sorted = [...notes].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  setTimeout(applySavedHighlights, 50);
}

let editingNoteId = null;

function openNoteEditor(note){
  editingNoteId = note ? note.id : null;
  document.getElementById("noteEditorTitle").textContent = note ? "编辑卡片" : "新建卡片";
  document.getElementById("neMonth").value = note ? (note.month || "01") : "01";
  document.getElementById("neTitle").value = note ? (note.title || "") : "";
  document.getElementById("neSub").value = note ? (note.sub || "") : "";
  document.getElementById("neTheory").value = note ? (note.theory || "") : "";
  document.getElementById("neAnalysis").value = note ? (note.analysis || "") : "";
  document.getElementById("neExam").value = note ? (note.exam || "") : "";
  document.getElementById("neFramework").value = note ? (note.framework || "") : "";

function closeNoteEditor(){
  document.getElementById("noteEditor").classList.remove("is-open");

}

function exportData(){
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    notes: getNotes(),
    bookmarks: getBookmarks(),
    highlights: getHighlights(),
    checkin: localStorage.getItem("wuli-checkin") || null,
    theme: localStorage.getItem("wuli-theme") || null
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "wuli-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("备份已下载 ✓");
}

function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm("导入会覆盖当前所有笔记、收藏和高亮数据，确定继续吗？")) return;
      if(Array.isArray(data.notes)) setNotes(data.notes);
      if(Array.isArray(data.bookmarks)) setBookmarks(data.bookmarks);
      if(data.highlights && typeof data.highlights === "object") setHighlights(data.highlights);
      if(data.checkin) try{ localStorage.setItem("wuli-checkin", data.checkin); }catch(e){}
      toast("导入成功 ✓");
      renderMonthly();
      renderNotes();
      renderBookmarks();
      updateHomeCounts();
      renderCheckin();
    }catch(err){
      toast("文件格式错误，导入失败");
    }
  };
  reader.readAsText(file);
}

    const hlObj = getHighlights();

      const p = hlObj[key].indexOf(text);
      if(p >= 0) hlObj[key].splice(p, 1);

      setHighlights(hlObj);

    updateHomeCounts();

    if(note) openNoteEditor(note);
    return;
  }

  const delBtn = e.target.closest("[data-note-del]");
  if(delBtn){

    if(!confirm("确定要删除这条笔记吗？")) return;
    const id = delBtn.dataset.noteDel;
    let notes = getNotes().filter(n => n.id !== id);
    setNotes(notes);
    const hlObj = getHighlights();
    delete hlObj["note-" + id];
    setHighlights(hlObj);

    renderNotes();
    renderMonthly();
    updateHomeCounts();
    toast("已删除");
    return;
  }

  const header = e.target.closest(".event-header");
  if(header){

    const isOpen = card.classList.toggle("is-open");
    header.setAttribute("aria-expanded", isOpen);
    const toggle = card.querySelector(".event-toggle");
    if(toggle) toggle.textContent = isOpen ? "－" : "＋";
    if(isOpen){
      const month = card.dataset.month;
      const idx = card.dataset.idx;
      if(month && idx !== undefined) markCheckin(month, idx);
      applySavedHighlights();
    }
    return;
  }

  const bm = e.target.closest("[data-bookmark]");
  if(bm){
    e.stopPropagation();
    const key = bm.dataset.bookmark;
    const list = getBookmarks();
    const pos = list.indexOf(key);
    const nowMarked = pos < 0;
    if(nowMarked){ list.push(key); toast("已收藏整卡 ★"); }
    else { list.splice(pos, 1); toast("已取消收藏"); }
    setBookmarks(list);

    document.querySelectorAll(`[data-bookmark="${key}"]`).forEach(b => {
      b.classList.toggle("is-marked", nowMarked);

    const bookmarkView = document.getElementById("view-bookmarks");
    if(bookmarkView && bookmarkView.classList.contains("is-active") && !nowMarked){
      renderBookmarks();

    showTheoryPopup(th);

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}
function markCheckin(m, i){
  try{
    let data = JSON.parse(localStorage.getItem("wuli-checkin") || "null");
    if(!data || data.date !== todayKey()){ data = { date: todayKey(), seen: [] }; }
    const k = eventKey(m, i);
    if(data.seen.indexOf(k) < 0) data.seen.push(k);
    localStorage.setItem("wuli-checkin", JSON.stringify(data));
    renderCheckin();
  }catch(e){}
}
function renderCheckin(){
  const el = document.getElementById("checkin");
  if(!el) return;
  try{
    const data = JSON.parse(localStorage.getItem("wuli-checkin") || "null");
    if(data && data.date === todayKey() && data.seen && data.seen.length > 0){
      el.innerHTML = `👣 今日已看 <b>${data.seen.length}</b> 条`;
      el.classList.remove("hidden");

function updateHomeCounts(){
  const cardList = getBookmarks();
  const hlObj = getHighlights();
  const sentCount = Object.values(hlObj).reduce((s, arr) => s + arr.length, 0);
  const total = cardList.length + sentCount;

  const bmCountEl = document.getElementById("bookmarkCount");
  if(bmCountEl) bmCountEl.textContent = `${total} 条收藏`;

  const noteCountEl = document.getElementById("noteCount");
  if(noteCountEl) noteCountEl.textContent = `${getNotes().length} 条笔记`;
}

function highlightTextInElement(root, text){
  if(!text || text.length < 2) return false;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while((n = walker.nextNode())){
    if(n.parentElement && n.parentElement.tagName === "MARK") continue;
    nodes.push(n);
  }
  for(const node of nodes){
    const idx = node.nodeValue.indexOf(text);
    if(idx >= 0){
      try{
        const range = document.createRange();
        range.setStart(node, idx);
        range.setEnd(node, idx + text.length);
        const mark = document.createElement("mark");
        mark.className = "user-hl";
        mark.dataset.hlText = text;
        range.surroundContents(mark);
        return true;
      }catch(err){}
    }
  }
  return false;
}

function applySavedHighlights(){
  const all = getHighlights();
  document.querySelectorAll(".event-card").forEach(card => {
    let key;
    if(card.dataset.noteId){
      key = "note-" + card.dataset.noteId;
    } else if(card.dataset.month && card.dataset.idx !== undefined){
      key = card.dataset.month + "-" + card.dataset.idx;
    } else {
      return;
    }
    const texts = all[key];
    if(!texts || !texts.length) return;
    const contentEls = card.querySelectorAll(".detail-text, .event-sub, .exam-hint, .quote-block, .event-title, .framework-block, .mock-block, .exam-item");
    contentEls.forEach(el => {
      texts.forEach(t => {
        highlightTextInElement(el, t);
      });
    });
  });
}

(function selectionBubble(){
  const bubble = document.getElementById("hlBubble");
  const toggleBtn = bubble.querySelector("[data-hl-action]");
  let pendingInfo = null;

  document.addEventListener("mouseup", handleSelection);
  document.addEventListener("touchend", handleSelection);

  function handleSelection(e){
    if(e.target.closest("#hlBubble")) return;

    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel.toString().trim();
      if(!text || text.length < 2){ hideBubble(); return; }

      const range = sel.getRangeAt(0);
      const startEl = range.startContainer.nodeType === 1
        ? range.startContainer
        : range.startContainer.parentElement;
      if(!startEl){ hideBubble(); return; }

      const card = startEl.closest(".event-card");
      if(!card){ hideBubble(); return; }

      const startMark = startEl.closest("mark.user-hl");
      const endEl = range.endContainer.nodeType === 1
        ? range.endContainer
        : range.endContainer.parentElement;
      const endMark = endEl && endEl.closest("mark.user-hl");
      const inMark = startMark || endMark;

      let key;
      if(card.dataset.noteId){
        key = "note-" + card.dataset.noteId;
      } else if(card.dataset.month && card.dataset.idx !== undefined){
        key = card.dataset.month + "-" + card.dataset.idx;
      } else {
        hideBubble();
        return;
      }

      pendingInfo = { key, text, inMark };
      toggleBtn.textContent = inMark ? "取消高亮" : "高亮收藏";

      const rect = range.getBoundingClientRect();
      bubble.classList.add("is-open");
      const bw = bubble.offsetWidth;
      const bh = bubble.offsetHeight;
      let left = rect.left + rect.width/2 - bw/2;
      let top = rect.top - bh - 8;
      left = Math.max(8, Math.min(window.innerWidth - bw - 8, left));
      if(top < 8) top = rect.bottom + 8;
      bubble.style.left = left + "px";
      bubble.style.top = top + "px";
    }, 10);
  }

  function hideBubble(){
    bubble.classList.remove("is-open");
    pendingInfo = null;
  }

  toggleBtn.addEventListener("click", () => {
    if(!pendingInfo) return;
    const { key, text, inMark } = pendingInfo;
    const hlObj = getHighlights();

    if(inMark){
      if(hlObj[key]){
        const p = hlObj[key].indexOf(text);
        if(p >= 0) hlObj[key].splice(p, 1);
        if(!hlObj[key].length) delete hlObj[key];
        setHighlights(hlObj);
      }
      document.querySelectorAll(`mark.user-hl[data-hl-text="${CSS.escape(text)}"]`).forEach(m => {
        const parent = m.parentNode;
        while(m.firstChild) parent.insertBefore(m.firstChild, m);
        parent.removeChild(m);
        parent.normalize();
      });
      toast("已取消高亮");
    } else {
      if(!hlObj[key]) hlObj[key] = [];
      if(hlObj[key].indexOf(text) < 0) hlObj[key].push(text);
      setHighlights(hlObj);

      const sel = window.getSelection();
      if(sel.rangeCount){
        const range = sel.getRangeAt(0);
        try{
          const mark = document.createElement("mark");
          mark.className = "user-hl";
          mark.dataset.hlText = text;
          range.surroundContents(mark);
        }catch(err){
          try{
            const frag = range.extractContents();
            const mark = document.createElement("mark");
            mark.className = "user-hl";
            mark.dataset.hlText = text;
            mark.appendChild(frag);
            range.insertNode(mark);
          }catch(e){}
        }
      }
      toast("已高亮收藏 ★");
    }

    window.getSelection().removeAllRanges();
    hideBubble();
    updateHomeCounts();

    const bmView = document.getElementById("view-bookmarks");
    if(bmView && bmView.classList.contains("is-active")){
      renderBookmarks();
    }
  });

  document.addEventListener("mousedown", e => {
    if(!e.target.closest("#hlBubble") && !window.getSelection().toString().trim()){
      hideBubble();
    }
  });
  window.addEventListener("scroll", hideBubble, true);
})();

(function searchModule(){

(function themeSwitcher(){
  const floater = document.getElementById("themeFloat");
  const btns = floater.querySelectorAll("button[data-set-theme]");
  const root = document.documentElement;
  const meta = document.getElementById("themeColorMeta");
  const themes = ["auto","default","night","ink","pink","retro"];
  const mq = window.matchMedia("(prefers-color-scheme: dark)");

  function syncThemeColor(){
    requestAnimationFrame(() => {
      const bg = getComputedStyle(root).getPropertyValue("--bg").trim();
      if(meta && bg) meta.setAttribute("content", bg);
    });
  }

  function applyTheme(t){
    let real = t;
    if(t === "auto") real = mq.matches ? "night" : "default";
    root.setAttribute("data-theme", real);
    btns.forEach(b => b.classList.toggle("is-active", b.dataset.setTheme === t));
    syncThemeColor();
  }
  function setTheme(t){
    if(!themes.includes(t)) t = "default";
    applyTheme(t);
    try{ localStorage.setItem("wuli-theme", t); }catch(e){}
  }

  btns.forEach(b => {
    b.addEventListener("click", e => {
      e.stopPropagation();
      setTheme(b.dataset.setTheme);
      floater.classList.remove("is-open");
    });
  });

  mq.addEventListener && mq.addEventListener("change", () => {
    try{
      const saved = localStorage.getItem("wuli-theme");
      if(saved === "auto") applyTheme("auto");
    }catch(e){}
  });

  try{
    const saved = localStorage.getItem("wuli-theme");
    if(saved) setTheme(saved);
    else syncThemeColor();
  }catch(e){ syncThemeColor(); }

  function applyPos(topPx){
    const h = floater.offsetHeight || 46;
    const minTop = 60;
    const maxTop = window.innerHeight - h - 20;
    const t = Math.max(minTop, Math.min(maxTop, topPx));
    floater.style.top = t + "px";
    floater.style.bottom = "auto";
  }
  try{
    const savedPos = JSON.parse(localStorage.getItem("wuli-theme-pos") || "null");
    if(savedPos && typeof savedPos.top === "number") applyPos(savedPos.top);
  }catch(e){}

  let dragging = false, moved = false, startY = 0, startTop = 0;
  floater.addEventListener("pointerdown", e => {
    if(e.target.closest("button[data-set-theme]")) return;
    dragging = true; moved = false;
    startY = e.clientY;
    startTop = floater.getBoundingClientRect().top;
    floater.classList.add("dragging");
    try{ floater.setPointerCapture(e.pointerId); }catch(err){}
  });
  floater.addEventListener("pointermove", e => {
    if(!dragging) return;
    const dy = e.clientY - startY;
    if(!moved && Math.abs(dy) > 4){
      moved = true;
      floater.style.top = startTop + "px";
      floater.style.bottom = "auto";
    }
    if(!moved) return;
    e.preventDefault();
    const h = floater.offsetHeight;
    const minTop = 60;
    const maxTop = window.innerHeight - h - 20;
    let nt = startTop + dy;
    nt = Math.max(minTop, Math.min(maxTop, nt));
    floater.style.top = nt + "px";
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    floater.classList.remove("dragging");
    try{ floater.releasePointerCapture(e.pointerId); }catch(err){}
    if(!moved){
      floater.classList.toggle("is-open");
    } else {
      const r = floater.getBoundingClientRect();
      try{ localStorage.setItem("wuli-theme-pos", JSON.stringify({top:r.top})); }catch(err){}
    }
  }
  floater.addEventListener("pointerup", endDrag);
  floater.addEventListener("pointercancel", endDrag);

  document.addEventListener("click", e => {
    if(!floater.contains(e.target)) floater.classList.remove("is-open");
  }, true);

  window.addEventListener("resize", () => {
    applyPos(floater.getBoundingClientRect().top);
  });
})();

(function scrollModule(){
  const backBtn = document.getElementById("backToTop");
  function onScroll(){
    const h = document.documentElement;
    const st = h.scrollTop || document.body.scrollTop;
    backBtn.classList.toggle("is-show", st > 400);
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
  backBtn.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));
})();

(function feedback(){
  const toggle = document.getElementById("feedbackToggle");
  const panel  = document.getElementById("feedbackPanel");
  const input  = document.getElementById("feedbackText");
  const btn    = document.getElementById("feedbackSend");
  const hint   = document.getElementById("feedbackHint");
  if(!toggle || !panel) return;
  const TO_EMAIL = "1597668105@qq.com";

  toggle.addEventListener("click", () => {
    const isOpen = panel.classList.toggle("is-open");
    toggle.classList.toggle("is-open", isOpen);
    if(isOpen) setTimeout(() => input && input.focus(), 60);
  });

  if(!btn) return;
  btn.addEventListener("click", () => {
    const text = input.value.trim();
    if(!text){
      hint.textContent = "先写点内容再发送吧～";
      hint.classList.remove("success");
      input.focus();
      return;
    }
    const subject = encodeURIComponent("wuli新传考研热点知识库 · 意见反馈");
    const body    = encodeURIComponent(text);
    window.location.href = `mailto:${TO_EMAIL}?subject=${subject}&body=${body}`;
    hint.textContent = "已打开邮箱客户端，点“发送”就能送达 ✓";
    hint.classList.add("success");
  });
})();

function showView(viewId){
  const views   = document.querySelectorAll(".view");
  const backBtn = document.getElementById("backBtn");
  views.forEach(v => v.classList.toggle("is-active", v.id === "view-" + viewId));
  backBtn.classList.toggle("is-show", viewId !== "home");
  window.scrollTo(0, 0);
  if(viewId === "bookmarks") renderBookmarks();
  if(viewId === "notes") renderNotes();
  if(viewId === "monthly") renderMonthly();
  setTimeout(applySavedHighlights, 60);
}

document.addEventListener("click", e => {
  const trigger = e.target.closest("[data-goto]");
  if(!trigger) return;
  e.preventDefault();
  showView(trigger.dataset.goto);
});

renderMonthly();
renderTopics();
renderBookmarks();
renderNotes();
updateHomeCounts();
renderCheckin();
setTimeout(applySavedHighlights, 300);
</script>
