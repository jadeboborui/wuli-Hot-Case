<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wuli新传热点知识库</title>
<style>
  :root{
    --bg:#f7f5f1;
    --surface:#ffffff;
    --ink:#191917;
    --ink-soft:#6e6960;
    --line:#e7e2d9;
    --brand:#2c5a4c;
    --brand-soft:#e7efeb;
    --accent:#c96a35;
    --radius:20px;
    --tag-bg:#f0ede6;
    --font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",
                 "SimSun",Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131311; --surface:#1c1c19; --ink:#eceae4; --ink-soft:#948e84;
      --line:#2d2d28; --brand:#7cc2a4; --brand-soft:#1d2b26; --accent:#e0864f;
      --tag-bg:#26261f;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-serif);
    font-size:15.5px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{ color:inherit; }

  .topbar{
    max-width:1080px; margin:0 auto; padding:26px 24px 0;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{
    display:inline-flex; align-items:center; gap:9px;
    font-size:14px; font-weight:600; text-decoration:none;
    letter-spacing:.02em;
    background:none; border:none; cursor:pointer;
    color:var(--ink); font-family:inherit; padding:0;
  }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--brand); }
  .back{
    display:none;
    padding:7px 15px; font-size:13px;
    color:var(--ink-soft); background:var(--surface);
    border:1px solid var(--line); border-radius:999px; transition:.2s;
    cursor:pointer; font-family:inherit;
  }
  .back:hover{ color:var(--brand); border-color:var(--brand); }
  .back.is-show{ display:inline-block; }

  .view{ display:none; }
  .view.is-active{
    display:block;
    animation:fadeUp .42s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:none; }
  }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px 90px; }
  .wrap-narrow{ max-width:960px; margin:0 auto; padding:0 24px 90px; }

  /* 首页 */
  .hero{ padding:6vh 0 0; max-width:760px; }
  .eyebrow{
    margin:0 0 18px;
    font-size:12.5px; font-weight:600;
    letter-spacing:.18em; color:var(--ink-soft);
  }
  .hero h1{
    margin:0 0 22px;
    font-size:clamp(2.1rem, 5.6vw, 3.4rem);
    font-weight:700; line-height:1.22; letter-spacing:-.01em;
  }
  .hero h1 .wuli{ color:var(--brand); }
  .lede{
    margin:0; max-width:46ch;
    font-size:15.5px; color:var(--ink-soft); line-height:1.9;
  }

  .entries{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px; margin-top:52px;
  }
  .entry{
    position:relative;
    display:flex; flex-direction:column;
    min-height:240px; padding:30px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    transition:transform .32s cubic-bezier(.2,.7,.3,1),
               box-shadow .32s, border-color .32s;
  }
  .entry:hover{
    transform:translateY(-4px);
    border-color:var(--brand);
    box-shadow:0 22px 45px -28px rgba(0,0,0,.4);
  }
  .entry-icon{
    width:48px; height:48px;
    display:grid; place-items:center;
    border-radius:14px;
    background:var(--brand-soft); color:var(--brand);
    transition:background .3s, color .3s;
  }
  .entry:hover .entry-icon{ background:var(--brand); color:#fff; }
  .entry-title{
    margin:24px 0 8px;
    font-size:21px; font-weight:700; letter-spacing:-.01em;
  }
  .entry-desc{
    margin:0; font-size:14px; color:var(--ink-soft);
    line-height:1.8; max-width:32ch;
  }
  .entry-foot{ margin-top:auto; padding-top:22px; }
  .entry-meta{
    font-size:12.5px; letter-spacing:.02em;
    color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .entry-arrow{
    position:absolute; right:28px; bottom:26px;
    font-size:19px; color:var(--ink-soft);
    transition:transform .3s, color .3s;
  }
  .entry:hover .entry-arrow{ transform:translateX(6px); color:var(--brand); }

  .foot{
    margin-top:64px; padding-top:22px;
    border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-soft);
  }

  /* =====================================================
     意见反馈（折叠版 · 单行显示）
     ===================================================== */
  .feedback{
    margin-top:14px;
  }

  .feedback-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
    padding:8px 0;
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    color:var(--ink-soft);
    text-align:left;
    transition:color .2s;
  }
  .feedback-toggle:hover{ color:var(--brand); }

  /* 关键：不让文字换行 */
  .feedback-toggle .ft-text{
    line-height:1.6;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    min-width:0;
  }
  .feedback-toggle .ft-text .sep{
    margin:0 6px;
    opacity:.45;
  }
  .feedback-toggle .ft-arrow{
    flex:0 0 auto;
    font-size:14px;
    color:var(--ink-soft);
    transition:transform .3s, color .3s;
    display:inline-block;
  }
  .feedback-toggle.is-open .ft-arrow{
    transform:rotate(45deg);
    color:var(--brand);
  }
  .feedback-toggle.is-open{ color:var(--brand); }

  .feedback-panel{
    display:none;
    padding:14px 0 4px;
    animation:fadeUp .3s cubic-bezier(.2,.7,.3,1) both;
  }
  .feedback-panel.is-open{ display:block; }

  .feedback-input{
    display:block;
    width:100%;
    min-height:80px;
    padding:11px 14px;
    font-family:inherit;
    font-size:14px;
    line-height:1.7;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    resize:vertical;
    outline:none;
    transition:border-color .2s;
  }
  .feedback-input:focus{ border-color:var(--brand); }
  .feedback-input::placeholder{ color:var(--ink-soft); opacity:.65; }

  .feedback-actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .feedback-send{
    padding:7px 18px;
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:var(--brand);
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:opacity .2s, transform .2s;
  }
  .feedback-send:hover{ opacity:.88; }
  .feedback-send:active{ transform:scale(.98); }
  .feedback-send:disabled{ opacity:.5; cursor:not-allowed; }

  .feedback-hint{
    font-size:12px;
    color:var(--ink-soft);
    transition:color .2s;
    flex:1;
    min-width:0;
  }
  .feedback-hint.success{ color:var(--brand); font-weight:600; }

  /* 通用页头 */
  .page-head{ padding:5.5vh 0 0; }
  .head-row{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:18px 24px; flex-wrap:wrap;
  }
  .page-head h1{
    margin:0;
    font-size:clamp(1.8rem, 3.8vw, 2.4rem);
    font-weight:700; letter-spacing:-.01em; line-height:1.2;
  }
  .head-meta{
    font-size:13px; color:var(--ink-soft);
    letter-spacing:.02em; white-space:nowrap; padding-bottom:4px;
  }
  .head-meta b{
    color:var(--brand); font-weight:700;
    font-variant-numeric:tabular-nums;
    margin:0 2px; font-size:14.5px;
  }
  .head-meta .sep{ margin:0 8px; opacity:.45; }

  /* 月份 Tab */
  .month-tabs{
    margin:38px 0 0;
    border-bottom:1px solid var(--line);
  }
  .tab-track{
    display:flex; gap:0;
    overflow-x:auto; scrollbar-width:none;
  }
  .tab-track::-webkit-scrollbar{ display:none; }

  .tab{
    position:relative; flex:0 0 auto;
    padding:0 0 16px; margin-right:40px;
    background:none; border:none; cursor:pointer;
    font-family:inherit; transition:color .2s;
  }
  .tab:last-child{ margin-right:0; }

  .tab .en{
    display:block; font-family:inherit;
    font-size:17px; font-weight:700; letter-spacing:.18em;
    color:var(--ink-soft); transition:color .25s;
  }
  .tab::after{
    content:""; position:absolute;
    left:0; right:0; bottom:-1px; height:2px;
    background:var(--brand);
    transform:scaleX(0); transform-origin:left;
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .tab:hover .en{ color:var(--ink); }
  .tab.is-active .en{ color:var(--brand); }
  .tab.is-active::after{ transform:scaleX(1); }

  /* 月份面板 */
  .month-panel{ display:none; margin-top:32px; }
  .month-panel.is-active{
    display:block;
    animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both;
  }

  .panel-intro{ margin:0 0 26px; }
  .intro-line1{
    margin:0 0 5px; font-size:15px; font-weight:600;
    color:var(--ink); letter-spacing:-.005em;
  }
  .intro-line1 .count{
    margin:0 3px; font-size:19px; font-weight:700;
    color:var(--brand); font-variant-numeric:tabular-nums;
  }
  .intro-line2{
    margin:0; font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .intro-line2 .badge{
    display:inline-block; padding:2px 9px;
    font-size:11px; font-weight:500;
    color:var(--ink-soft); background:var(--tag-bg);
    border-radius:999px; letter-spacing:.02em;
  }

  /* 事件卡片 */
  .event-list{ display:grid; gap:14px; }

  .event-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .28s, box-shadow .28s;
  }
  .event-card:hover{
    border-color:var(--brand);
    box-shadow:0 12px 30px -20px rgba(0,0,0,.35);
  }

  .event-header{
    display:flex; align-items:flex-start; gap:16px;
    padding:22px 24px; cursor:pointer; user-select:none;
  }
  .event-idx{
    flex:0 0 32px; width:32px; height:32px;
    display:grid; place-items:center;
    border-radius:10px;
    font-size:13px; font-weight:700;
    background:var(--brand-soft); color:var(--brand);
    transition:background .25s, color .25s;
    font-variant-numeric:tabular-nums;
  }
  .event-card.is-open .event-idx{ background:var(--brand); color:#fff; }

  .event-body{ flex:1; min-width:0; }

  .event-month{
    display:inline-block;
    margin-bottom:6px;
    padding:1px 8px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.14em;
    color:var(--brand);
    background:var(--brand-soft);
    border-radius:4px;
    font-variant-numeric:tabular-nums;
  }
  .event-card.is-open .event-month{
    background:var(--brand);
    color:#fff;
  }

  .event-title{
    margin:0 0 6px; font-size:16.5px; font-weight:700;
    letter-spacing:-.005em; line-height:1.5;
  }
  .event-sub{
    margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.7;
  }
  .event-toggle{
    flex:0 0 auto; width:24px; height:24px; margin-top:4px;
    display:grid; place-items:center;
    color:var(--ink-soft); font-size:16px;
    transition:transform .3s;
  }
  .event-card.is-open .event-toggle{ transform:rotate(45deg); color:var(--brand); }

  .event-detail{
    display:none; padding:0 24px 24px 72px; font-size:14.5px;
  }
  .event-card.is-open .event-detail{ display:block; }

  #topicEvents .event-detail{
    padding-left: 24px;
  }

  .detail-block{ margin-bottom:16px; }
  .detail-block:last-child{ margin-bottom:0; }
  .detail-label{
    display:inline-block; margin-bottom:6px;
    font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:var(--accent);
  }
  .detail-text{ margin:0; color:var(--ink); line-height:1.85; }

  .theory-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .theory-tag{
    padding:3px 11px; font-size:12px; font-weight:500;
    background:var(--tag-bg); color:var(--ink-soft);
    border-radius:999px;
  }

  .exam-hint{
    margin-top:16px; padding:14px 18px;
    background:var(--brand-soft); border-radius:12px;
    font-size:14px; line-height:1.8;
  }
  .exam-hint::before{
    content:"✦ 考点角度";
    display:block; margin-bottom:5px;
    font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:var(--brand);
  }

  /* 专题热点网格 */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:16px; margin-top:32px;
  }
  .cat-card{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; padding:22px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    transition:transform .28s cubic-bezier(.2,.7,.3,1),
               border-color .28s, box-shadow .28s;
  }
  .cat-card:hover{
    transform:translateY(-3px);
    border-color:var(--brand);
    box-shadow:0 16px 34px -24px rgba(0,0,0,.4);
  }
  .cat-card h3{ margin:0; font-size:15px; font-weight:600; }
  .cc-count{
    flex:0 0 auto; font-size:12.5px;
    color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }

  /* 专题详情页 */
  .topic-head{ padding:4.5vh 0 0; }
  .topic-back{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px;
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    margin-bottom:26px;
    transition:.22s;
  }
  .topic-back:hover{ color:var(--brand); border-color:var(--brand); }

  .topic-title-row{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:18px 24px; flex-wrap:wrap;
  }
  .topic-head h1{
    margin:0;
    font-size:clamp(1.8rem, 3.8vw, 2.4rem);
    font-weight:700; letter-spacing:-.01em; line-height:1.2;
  }
  .topic-desc{
    margin:16px 0 0;
    max-width:58ch;
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.85;
  }
  .topic-divider{
    margin:30px 0 0;
    border-top:1px solid var(--line);
  }

  .placeholder-note{
    margin-top:26px; padding:14px 18px;
    font-size:13px; color:var(--ink-soft);
    background:var(--brand-soft); border-radius:12px;
    line-height:1.8;
  }

  @media (max-width:720px){
    .entries{ grid-template-columns:1fr; gap:16px; margin-top:40px; }
    .entry{ min-height:0; padding:26px; }
    .entry-title{ margin-top:20px; }
    .hero{ padding-top:4vh; }
    .topbar{ padding:20px 20px 0; }
    .wrap, .wrap-narrow{ padding:0 20px 70px; }
    .page-head{ padding-top:4vh; }
    .head-row{ gap:6px; }
    .head-meta{ padding-bottom:0; font-size:12.5px; }
    .head-meta b{ font-size:13.5px; }
    .month-tabs{ margin-top:30px; }
    .event-header{ padding:18px; gap:12px; }
    .event-detail{ padding:0 18px 20px 18px; }
    #topicEvents .event-detail{ padding-left:18px; }
    .tab{ margin-right:26px; }
    .tab .en{ font-size:15px; letter-spacing:.14em; }
    .intro-line1{ font-size:14px; }
    .intro-line1 .count{ font-size:17px; }
    .topic-head{ padding-top:3vh; }
    /* 移动端：字号略缩，让整句仍在一行内 */
    .feedback-toggle{ font-size:12px; gap:8px; }
    .feedback-toggle .ft-text .sep{ margin:0 4px; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <button class="brand" data-goto="home">
    <span class="dot"></span>Wuli 新传
  </button>
  <button class="back" id="backBtn" data-goto="home">← 返回首页</button>
</nav>

<main>

  <!-- 首页 -->
  <section id="view-home" class="view is-active">
    <div class="wrap">
      <header class="hero">
        <p class="eyebrow">新闻与传播 新闻传播学 出版 · 考研热点</p>
        <h1><span class="wuli">Wuli</span>新传热点知识库</h1>
        <p class="lede">按部就班就是伟大。热点是我们的案例库，也是题库，能背、能用是我们的目标(๑•̀ㅂ•́)و✧</p>
      </header>

      <div class="entries">
        <button class="entry" data-goto="monthly">
          <div class="entry-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2.5"/>
              <path d="M3 10h18"/><path d="M8 3v4M16 3v4"/>
            </svg>
          </div>
          <h2 class="entry-title">每月热点</h2>
          <p class="entry-desc">按月份归档当月新闻传播热点，附考点角度与理论关联。</p>
          <div class="entry-foot">
            <span class="entry-meta">2026 年 · 6 期 · 16 条</span>
          </div>
          <span class="entry-arrow" aria-hidden="true">→</span>
        </button>

        <button class="entry" data-goto="category">
          <div class="entry-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="7" height="7" rx="2"/>
              <rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
              <rect x="3.5" y="13.5" width="7" height="7" rx="2"/>
              <rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
            </svg>
          </div>
          <h2 class="entry-title">专题热点</h2>
          <p class="entry-desc">按专题聚合热点，让热点不再零散</p>
          <div class="entry-foot">
            <span class="entry-meta">8 个专题 · 持续更新</span>
          </div>
          <span class="entry-arrow" aria-hidden="true">→</span>
        </button>
      </div>

      <footer class="foot">Wuli 新传热点知识库 · 内容持续更新中</footer>

      <!-- 意见反馈（折叠版） -->
      <section class="feedback" aria-label="意见反馈">
        <button class="feedback-toggle" id="feedbackToggle">
          <span class="ft-text">希望增添<span class="sep">/</span>错误修改<span class="sep">/</span>其他意见<span class="sep">/</span>找到我 · 欢迎留下脚印 👣</span>
          <span class="ft-arrow" aria-hidden="true">＋</span>
        </button>
        <div class="feedback-panel" id="feedbackPanel">
          <textarea class="feedback-input" id="feedbackText"
                    placeholder="写下你的想法、发现的问题，或想看到的专题…"></textarea>
          <div class="feedback-actions">
            <span class="feedback-hint" id="feedbackHint"></span>
            <button class="feedback-send" id="feedbackSend">发送 →</button>
          </div>
        </div>
      </section>
    </div>
  </section>

  <!-- 每月热点 -->
  <section id="view-monthly" class="view">
    <div class="wrap-narrow">
      <header class="page-head">
        <div class="head-row">
          <h1>每月热点</h1>
          <div class="head-meta" id="headMeta"></div>
        </div>
      </header>
      <nav class="month-tabs">
        <div class="tab-track" id="tabTrack"></div>
      </nav>
      <div id="monthPanels"></div>
    </div>
  </section>

  <!-- 专题热点（列表） -->
  <section id="view-category" class="view">
    <div class="wrap-narrow">
      <header class="page-head">
        <div class="head-row">
          <h1>专题热点</h1>
          <div class="head-meta">已规划 <b>8</b> 个专题</div>
        </div>
      </header>

/* =========================================================
   意见反馈
   ========================================================= */
(function feedback(){
  const toggle = document.getElementById("feedbackToggle");
  const panel  = document.getElementById("feedbackPanel");
  const input  = document.getElementById("feedbackText");
  const btn    = document.getElementById("feedbackSend");
  const hint   = document.getElementById("feedbackHint");
  if(!toggle || !panel) return;

  const TO_EMAIL = "1597668105@qq.com";

  toggle.addEventListener("click", () => {
    const isOpen = panel.classList.toggle("is-open");
    toggle.classList.toggle("is-open", isOpen);
    if(isOpen){
      setTimeout(() => input && input.focus(), 60);
    }
  });

  if(!btn) return;

  btn.addEventListener("click", () => {
    const text = input.value.trim();

    if(!text){
      hint.textContent = "先写点内容再发送吧～";
      hint.classList.remove("success");
      input.focus();
      return;
    }

    const subject = encodeURIComponent("Wuli新传热点知识库 · 意见反馈");
    const body    = encodeURIComponent(text);

    window.location.href =
      `mailto:${TO_EMAIL}?subject=${subject}&body=${body}`;

    hint.textContent = "已打开邮箱客户端，点“发送”就能送达 ✓";
    hint.classList.add("success");
  });
})();

/* =========================================================
   渲染：每月热点
   ========================================================= */
const MONTH_ORDER = ["01","02","03","04","05","06"];

(function renderMonthly(){

  const trackEl  = document.getElementById("tabTrack");
  const panelsEl = document.getElementById("monthPanels");
  const metaEl   = document.getElementById("headMeta");

  const totalMonths = MONTH_ORDER.length;
  const totalEvents = MONTH_ORDER.reduce((s,k) => s + HOTSPOTS[k].events.length, 0);
  metaEl.innerHTML =
    `已收录 <b>${totalMonths}</b> 个月<span class="sep">·</span>共 <b>${totalEvents}</b> 条热点`;

  trackEl.innerHTML = MONTH_ORDER.map((key, i) => {
    const m = HOTSPOTS[key];
    return `<button class="tab${i===0?" is-active":""}" data-month="${key}">
      <span class="en">${m.en}</span>
    </button>`;
  }).join("");

  panelsEl.innerHTML = MONTH_ORDER.map((key, i) => {
    const m = HOTSPOTS[key];
    const n = m.events.length;

    const eventsHTML = m.events.map((ev, j) => `
      <article class="event-card" data-month="${key}">
        <header class="event-header" role="button" tabindex="0" aria-expanded="false">
          <span class="event-idx">${String(j+1).padStart(2,"0")}</span>
          <div class="event-body">
            <h3 class="event-title">${esc(ev.title)}</h3>
            <p class="event-sub">${esc(ev.sub)}</p>
          </div>
          <span class="event-toggle" aria-hidden="true">＋</span>
        </header>
        <div class="event-detail">
          <div class="detail-block">
            <span class="detail-label">事件分析</span>
            <p class="detail-text">${esc(ev.analysis)}</p>
            <div class="theory-tags">
              ${(ev.theory||"").split(" · ").map(t=>`<span class="theory-tag">${esc(t)}</span>`).join("")}
            </div>
          </div>
          <div class="exam-hint">${esc(ev.exam)}</div>
        </div>
      </article>
    `).join("");

    return `<section class="month-panel${i===0?" is-active":""}" id="panel-${key}">
      <div class="panel-intro">
        <p class="intro-line1">本月收录<span class="count">${n}</span>条热点</p>
        <p class="intro-line2">点击查看分析角度与答题思路<span class="badge">仅供参考版</span></p>
      </div>
      <div class="event-list">${eventsHTML}</div>
    </section>`;
  }).join("");

  trackEl.addEventListener("click", e => {
    const btn = e.target.closest(".tab");
    if(!btn) return;
    const key = btn.dataset.month;

    trackEl.querySelectorAll(".tab").forEach(b =>
      b.classList.toggle("is-active", b.dataset.month === key)
    );
    panelsEl.querySelectorAll(".month-panel").forEach(p =>
      p.classList.toggle("is-active", p.id === "panel-"+key)
    );
  });

  panelsEl.addEventListener("click", e => {
    const header = e.target.closest(".event-header");
    if(!header) return;
    const card = header.closest(".event-card");
    const open = card.classList.toggle("is-open");
    header.setAttribute("aria-expanded", open);
    card.querySelector(".event-toggle").textContent = open ? "－" : "＋";
  });

  panelsEl.addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const header = e.target.closest(".event-header");
    if(!header) return;
    e.preventDefault();
    header.click();
  });

})();

/* =========================================================
   渲染：专题热点列表 + 详情
   ========================================================= */
(function renderTopics(){

  const catGrid = document.getElementById("catGrid");

  catGrid.innerHTML = Object.keys(TOPICS).map(key => {
    const t = TOPICS[key];
    return `<button class="cat-card" data-topic="${key}">
      <h3>${esc(t.name)}</h3>
      <span class="cc-count">${t.events.length} 条</span>
    </button>`;
  }).join("");

  const topicTitleEl  = document.getElementById("topicTitle");
  const topicDescEl   = document.getElementById("topicDesc");
  const topicMetaEl   = document.getElementById("topicMeta");
  const topicEventsEl = document.getElementById("topicEvents");

  window.openTopic = function(key){
    const t = TOPICS[key];
    if(!t) return;

    topicTitleEl.textContent = t.name;
    topicDescEl.textContent  = t.desc;
    topicMetaEl.innerHTML    = `共 <b>${t.events.length}</b> 条热点`;

    if(!t.events.length){
      topicEventsEl.innerHTML = `
        <div class="placeholder-note">
          这个专题的内容正在筹备中，后续会补充热点事件与考点解析。
          你也可以先到「每月热点」按时间线查看已整理的内容。
        </div>`;
    } else {
      topicEventsEl.innerHTML = t.events.map((ref) => {
        const src = HOTSPOTS[ref.from.month];
        if(!src) return "";
        const ev = src.events[ref.from.idx];
        if(!ev) return "";

        return `
          <article class="event-card">
            <header class="event-header" role="button" tabindex="0" aria-expanded="false">
              <div class="event-body">
                <span class="event-month">${ref.month}</span>
                <h3 class="event-title">${esc(ev.title)}</h3>
                <p class="event-sub">${esc(ev.sub)}</p>
              </div>
              <span class="event-toggle" aria-hidden="true">＋</span>
            </header>
            <div class="event-detail">
              <div class="detail-block">
                <span class="detail-label">事件分析</span>
                <p class="detail-text">${esc(ev.analysis)}</p>
                <div class="theory-tags">
                  ${(ev.theory||"").split(" · ").map(tt=>`<span class="theory-tag">${esc(tt)}</span>`).join("")}
                </div>
              </div>
              <div class="exam-hint">${esc(ev.exam)}</div>
            </div>
          </article>
        `;
      }).join("");
    }

    showView("topic");
    window.scrollTo(0, 0);
  };

  catGrid.addEventListener("click", e => {
    const card = e.target.closest("[data-topic]");
    if(!card) return;
    openTopic(card.dataset.topic);
  });

  topicEventsEl.addEventListener("click", e => {
    const header = e.target.closest(".event-header");
    if(!header) return;
    const card = header.closest(".event-card");
    const open = card.classList.toggle("is-open");
    header.setAttribute("aria-expanded", open);
    card.querySelector(".event-toggle").textContent = open ? "－" : "＋";
  });

  topicEventsEl.addEventListener("keydown", e => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const header = e.target.closest(".event-header");
    if(!header) return;
    e.preventDefault();
    header.click();
  });

})();

/* =========================================================
   视图路由
   ========================================================= */
function showView(viewId){
  const views   = document.querySelectorAll(".view");
  const backBtn = document.getElementById("backBtn");

  views.forEach(v => v.classList.toggle("is-active", v.id === "view-" + viewId));
  backBtn.classList.toggle("is-show", viewId !== "home");
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const trigger = e.target.closest("[data-goto]");
  if(!trigger) return;
  e.preventDefault();
  showView(trigger.dataset.goto);
});

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
